name: Validate Vehicle Profiles

on: [pull_request]

jobs:
  validate-vehicle-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: |
          cd .vehicle_profiles
          npm ci
          npm run validate
