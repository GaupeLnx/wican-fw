name: Deploy Docus Site
on:
  push:
    branches:
      - wican-pro 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install & Build
        working-directory: ./docs 
        run: |
          npm install --legacy-peer-deps
          # Approve every package with unreviewed install scripts in one go
          npm approve-scripts --all
          # Force esbuild and vue-demi to download their required binaries
          npm rebuild
          echo "export const PinceauTheme = {};" >> node_modules/pinceau/dist/index.mjs
          echo "export const PropertyValue = {};" >> node_modules/pinceau/dist/index.mjs
          npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public 

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
