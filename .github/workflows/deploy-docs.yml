name: Deploy Docus Site
on:
  push:
    branches:
      - wican-pro
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Patch Broken Pinceau Dependency
        run: |
          echo "export const PinceauTheme = {};" >> node_modules/pinceau/dist/index.mjs
          echo "export const PropertyValue = {};" >> node_modules/pinceau/dist/index.mjs

      - name: Generate Static Site
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
