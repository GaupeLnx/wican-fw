name: Deploy Docus Site
on:
  push:
    branches:
      - wican-pro
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # THIS LINE IS THE FIX:
    defaults:
      run:
        working-directory: ./docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @nuxt/vite-builder vite --legacy-peer-deps
      - name: Patch Broken Pinceau Dependency
        # Note: We use the full path here to ensure the echo hits the right spot
        run: |
          echo "export const PinceauTheme = {};" >> node_modules/pinceau/dist/index.mjs
          echo "export const PropertyValue = {};" >> node_modules/pinceau/dist/index.mjs

      - name: Generate Static Site
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to the output folder inside docs
          path: docs/.output/public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
