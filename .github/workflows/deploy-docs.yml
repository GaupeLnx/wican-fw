name: Deploy Docus Site

on:
  push:
    branches:
      - wican-pro  # This ensures it only builds when you push to wican-pro

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt-in to the new standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Updated from v3

      - name: Setup Node
        uses: actions/setup-node@v4 # Updated from v3
        with:
          node-version: 22 # Use a stable LTS version

      - name: Install dependencies
        run: npm install

      - name: Generate Static Site
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
